{% extends "base.html" %}
{% block title %}Order history · CPT Canteen{% endblock %}
{% block content %}
<section>
  <div class="section-head">
    <h2>Order history</h2>
    <span class="muted" id="hist-summary"></span>
  </div>
  <div class="filters">
    <input type="search" id="h-q" placeholder="Search by order ID or dish" aria-label="Search order history">
    <select id="h-status" aria-label="Filter by status">
      <option value="all">All statuses</option>
      <option value="pending">Pending</option>
      <option value="preparing">Preparing</option>
      <option value="ready">Ready</option>
      <option value="picked_up">Picked up</option>
      <option value="cancelled">Cancelled</option>
    </select>
  </div>
  <div id="hist-list" class="order-list"></div>
</section>

<div class="modal-backdrop hidden" id="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qr-title">
  <div class="modal">
    <div class="modal-head"><h3 id="qr-title">Pickup pass</h3><button class="modal-close" data-close aria-label="Close">&times;</button></div>
    <div class="modal-body" id="qr-body"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/history.js') }}"></script>{% endblock %}
